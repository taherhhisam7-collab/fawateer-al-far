<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>إعادة ضبط التطبيق</title>
<style>body{font-family:Tahoma,Arial;background:#0f766e;color:#fff;display:grid;place-items:center;height:100vh;margin:0;text-align:center}</style>
</head>
<body>
<div><h2>جاري إعادة ضبط التطبيق...</h2><p>سيتم فتح النسخة الحالية بعد ثوانٍ.</p></div>
<script>
(async function () {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }
    localStorage.removeItem('fawateer_install_done');
    sessionStorage.clear();
  } catch (e) {}
  location.replace('/?fresh=1');
})();
</script>
</body>
</html>
